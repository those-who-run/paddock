# The kustomize base for v2 (paddock#44): NATS from its chart, the stream and KV
# bootstrap Job, logbook, and radio speaking to the console (paddock#63). It names nothing that belongs to one cluster (ADR 0004,
# point 8): no namespace, host, storage class, node or host port. An overlay sets
# those, and switches on what it wants of deploy/components/:
#
# - nats-websocket: the Ingress to NATS's WebSocket, with the overlay's host, class
#   and TLS secret (deploy/nats/README.md);
# - network-policy: only the namespace's own pods reach NATS and logbook, and the
#   ingress controller's namespace reaches the WebSocket; for a cluster that enforces
#   NetworkPolicy;
# - radio-discord: radio speaks in Discord, with the bot's token and voice channel
#   from a Secret the overlay provides.
#
# NATS's chart needs `kustomize build --enable-helm`, with kustomize 5.7.x, not 5.8
# (kubernetes-sigs/kustomize#6058). `kubectl apply -k` cannot inflate it, so apply
# `kustomize build --enable-helm <overlay> | kubectl apply -f -`. Argo CD needs
# `kustomize.buildOptions: --enable-helm`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../nats/chart
  - ../nats
  - logbook-statefulset.yaml
  - logbook-service.yaml
  - radio-deployment.yaml
  - radio-service.yaml

# On every object and pod, so `kubectl get all -l app.kubernetes.io/part-of=twr`
# lists the stack. Not on selectors: the chart's own selectors stay as it renders
# them, and a selector cannot change once applied.
labels:
  - pairs:
      app.kubernetes.io/part-of: twr
    includeSelectors: false
    includeTemplates: true

# logbook's and radio's images, by tag and by the digest of its index, the same string as
# deploy/compose/compose.yaml. NATS, nats-box and the exporter are pinned where they
# are used, in deploy/nats/chart/values.yaml and deploy/nats/bootstrap-job.yaml, and
# not again here, so there is one place to bump each. scripts/deploy_check.py fails
# the base's render when any image in it is not compose's.
#
# Bump it with compose's, in one change, or make deploy-render fails.
images:
  - name: ghcr.io/those-who-run/twr-logbook
    newTag: 0.1.5
    digest: sha256:f54dcf151b6419294bc64136074004818d463532506977e4e5d0c82f58047fb4
  - name: ghcr.io/those-who-run/twr-radio
    newTag: 0.1.2
    digest: sha256:a7a50fab237875c8b2d38d9851ed52e40a7c55d7acbb3bfebbe02e78a38e6737
