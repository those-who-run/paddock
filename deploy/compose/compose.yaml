# The walking skeleton on a laptop (paddock#39): NATS with JetStream, the stream and
# KV bootstrap, logbook, radio for hearing a replay, and nats-box for looking at the
# bus. No PS5, no cluster.
# The make targets in paddock's Makefile run it (`make up`, `make replay`, `make sub`,
# `make export`, `make down`, `make reset`); deploy/compose/README.md says how.
#
# Every image is pinned by version tag and by the digest of its index; Renovate's
# docker-compose manager bumps both (renovate.json turns on pinDigests for it).
# tests/test_compose.py fails an image with no digest, a `latest` tag, a port that is
# published beyond 127.0.0.1, or a NATS image that differs from scripts/nats_it.sh's.
#
# What the cluster also needs is kept the same here, so the kustomize base copies it
# rather than reinventing it: the definitions in deploy/nats, the bootstrap run as
# user 1000 and logbook, radio and ecu as 65532, each on a read-only root file system, every
# capability dropped and no new privileges, the environment variable names, and
# logbook's data at /data. tests/test_compose.py fails a service without cap_drop ALL
# and no-new-privileges, and one with network_mode, privileged, cap_add, or build
# without image.

name: twr

services:
  nats:
    image: docker.io/library/nats:2.15.1-alpine@sha256:7ae34c25dfd6fe2e01c6483eabef20d796690fdcac6c4d94ca780a6cf9877fde
    command: ["-js", "-sd", "/data", "-m", "8222"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - nats-data:/data
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    healthcheck:
      # Healthy once JetStream is up, not only the server: the bootstrap needs it.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  # deploy/nats/bootstrap.sh once, after nats is healthy; logbook starts only when it
  # has exited 0. A second `make up` runs it again, which changes nothing.
  nats-bootstrap:
    image: docker.io/natsio/nats-box:0.20.0@sha256:d2f04223f40e016f77922a8115d34b0cd5fad2ec10b19b39316ae92d07f3d295
    command: ["sh", "/nats/bootstrap.sh", "/nats"]
    user: "1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - type: bind
        source: ../nats
        target: /nats
        read_only: true
        # Relabels the mount where SELinux is on (podman on Fedora); ignored elsewhere.
        bind:
          selinux: z
    depends_on:
      nats:
        condition: service_healthy
    restart: "no"

  # logbook's image is distroless, with no shell or HTTP client, so compose cannot
  # probe /healthz from inside it. `make up` polls it from the host, on the port
  # published below, until it answers 200.
  logbook:
    image: ghcr.io/those-who-run/twr-logbook:0.1.4@sha256:6784811e6371d22c4511537b7ba98ea0c576868bf9e30d88f8bd6492bd7a9c9e
    # v2 images are amd64 only (ADR 0006); on an arm64 machine this runs it under
    # emulation rather than failing to find a matching platform.
    platform: linux/amd64
    # It writes only to /data; /tmp is there for anything that wants a temporary file.
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TWR_NATS_URL: nats://nats:4222
      TWR_DATA_DIR: /data
      TWR_HEALTH_ADDR: ":8080"
      LOG_LEVEL: info
    volumes:
      - logbook-data:/data
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      nats-bootstrap:
        condition: service_completed_successfully

  # `ecu replay` of a v1 recording onto the bus, once, on demand: `make replay`, or the
  # parity harness (parity/v2.go), which runs it as `run --rm --no-deps replay replay
  # --src parity --speed max /recording/<file>` with the recording mounted itself. So
  # the service is ecu's image with its own entrypoint, and its command is ecu's
  # arguments. Profile `replay`: `make up` does not start it. The recordings directory
  # (TWR_RECORDINGS, paddock's recordings/ by default) is mounted read-only at
  # /recordings. A replay serves no /healthz and writes nothing, so it has no port and
  # no volume of its own.
  replay:
    image: ghcr.io/those-who-run/twr-ecu:0.1.9@sha256:e8968eba69474a370ebd9b0ca25a7116265b484fc501fa2e095db9f8562376b5
    platform: linux/amd64
    profiles: [replay]
    command: ["replay", "--help"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TWR_NATS_URL: nats://nats:4222
      LOG_LEVEL: info
    volumes:
      - type: bind
        source: ${TWR_RECORDINGS:-../../recordings}
        target: /recordings
        read_only: true
        bind:
          selinux: z
    depends_on:
      nats-bootstrap:
        condition: service_completed_successfully
    restart: "no"

  # radio (paddock#63): speaks the callouts of a source, `replay-compose` by default
  # (what `make replay` publishes), to the console, a line a callout in its log, or
  # with TWR_RADIO_SINK=wav also as a numbered WAV file a callout in
  # TWR_RADIO_WAV (.cache/radio-wav in paddock by default). `make radio` starts it;
  # start it before the replay, since CALLOUTS keeps a callout 30 s only. Profile
  # `replay`: `make up` does not start it. `simulated` timing, on the replay's own
  # clock, says what a driver would have heard at any SPEED. No Discord: that comes
  # with paddock#58, and the cluster's component deploy/components/radio-discord.
  #
  # It runs as TWR_UID:TWR_GID, 65532 by default as in the image; `make radio`
  # passes your own under Docker, and 0:0 under rootless podman, where the
  # container's root is you, so the WAVs land in a directory you own either way.
  radio:
    image: ghcr.io/those-who-run/twr-radio:0.1.2@sha256:a7a50fab237875c8b2d38d9851ed52e40a7c55d7acbb3bfebbe02e78a38e6737
    platform: linux/amd64
    profiles: [replay]
    user: "${TWR_UID:-65532}:${TWR_GID:-65532}"
    # The speech cache is under /tmp (the image's XDG_CACHE_HOME).
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      TWR_NATS_URL: nats://nats:4222
      TWR_HEALTH_ADDR: ":8080"
      TWR_LOG_LEVEL: info
      TWR_LOG_FORMAT: text
      TWR_RADIO_SRC: ${TWR_RADIO_SRC:-replay-compose}
      TWR_RADIO_SINK: ${TWR_RADIO_SINK:-console}
      TWR_RADIO_TIMING: ${TWR_RADIO_TIMING:-simulated}
      TWR_RADIO_WAV_DIR: /wav
    volumes:
      - type: bind
        source: ${TWR_RADIO_WAV:-../../.cache/radio-wav}
        target: /wav
        bind:
          selinux: z
          create_host_path: true
    depends_on:
      nats-bootstrap:
        condition: service_completed_successfully

  # For looking at the bus: `make sub`, or
  # `docker compose -p twr -f deploy/compose/compose.yaml run --rm nats-box`
  # for a shell with the nats CLI pointed at the server.
  nats-box:
    image: docker.io/natsio/nats-box:0.20.0@sha256:d2f04223f40e016f77922a8115d34b0cd5fad2ec10b19b39316ae92d07f3d295
    profiles: [tools]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      nats:
        condition: service_healthy

volumes:
  nats-data:
  logbook-data:
