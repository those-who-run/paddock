name: CI

# Two jobs are required by name on `main`: `test`, paddock's own checks, and
# `checks / checks`, the language-neutral checks every repository runs, from
# checks.yml in those-who-run/.github. Renaming either leaves `main` waiting for a
# check that never reports.
#
# merge_group runs them again on what a merge queue would land, the PR merged onto
# `main` and the PRs ahead of it; a queue whose required checks never report there
# never merges.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; each job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run; runs on main and in the merge
# queue always finish (a queue run has a ref of its own, and the queue would read a
# cancelled run as a failure).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions and the reusable workflow are pinned by commit SHA (the tag in the
# comment); Renovate bumps them (renovate.json).
jobs:
  # paddock's own checks, the same `make test`, `make nats-it` and `make compose-it`
  # a laptop runs: the Markdown links, the labels page against labels.yml, the guard
  # copy against .github's agent/ at the commit pinned for checks.yml below, the NATS
  # definitions against contracts' subjects.yaml, and the tests of those checks; then
  # the stream and KV bootstrap against a real nats-server, in the runner's docker, with the
  # images scripts/nats_it.sh pins by digest. The overlap check runs first, so a
  # definition that overlaps fails before it reaches a server. Last, the walking
  # skeleton in deploy/compose comes up from nothing in the runner's docker compose,
  # is checked and is torn down (scripts/compose_it.sh, paddock#39).
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: paddock's checks
        run: make test
      - name: The NATS bootstrap against a real server
        run: make nats-it
      - name: The walking skeleton, from nothing to reset
        run: make compose-it

  # The commit hooks on every file, gitleaks over the PR's commits, the PR title and
  # dependency review. No `if:` or `needs:`, so the required check always reports.
  # The guard copy check reads this pin, so bump the copies in .claude/ with it.
  checks:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/checks.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15

  # The parity harness (parity/, paddock#40), a Go module of its own: gofmt, go mod
  # tidy, go vet, golangci-lint, the tests with the race detector and the coverage
  # floor, go build and govulncheck, as `make -C parity check` runs them, behind the
  # Go test guard. It reports as `parity / check`. The harness's own run on the
  # default recordings is the `parity-laps` job, in parity-laps.yml.
  parity:
    permissions:
      contents: read
      pull-requests: read # the weakened-tests check reads the PR's description
    uses: those-who-run/.github/.github/workflows/go.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      working-directory: parity
      coverage-floor: 90
