name: Parity laps

# The parity harness's own runs: parity-laps (paddock#40 R6, AC1 and AC4), where
# `make parity` replays the three default recordings through v1's image and through
# the compose stack and fails on any lap that differs, and parity-events (paddock#104,
# below), parity-spoken (paddock#64) and parity-pitwall (paddock#133, at the end). They need no secrets and fetch nothing but the images, the Go toolchain
# and the harness's Go modules (checksummed in parity/go.sum): v1's image is pinned
# by digest in parity/v1.go, v2's in deploy/compose/compose.yaml (and parity-pitwall's
# logbook and pit wall in parity/wallsides.go), and every recording
# is checked against its sha256 in recordings/SOURCES.yaml before anything runs. The
# log names the images it used.
#
# It runs for PRs that touch the stack, the recordings or the harness, for pushes to
# `main` that touch them (two PRs that each pass can break parity together, and this
# shows it straight after the second merges), every week on `main` (an image pinned
# by tag and digest doesn't move, but a runner's docker or compose can), and by hand.
# None is a required check: a required check must report on every PR and in the
# merge queue, and these are filtered by path. Making one so means moving the job
# into ci.yml without the path filter.
on:
  pull_request:
    paths:
      - deploy/**
      - parity/**
      - recordings/**
      - Makefile
      - .github/workflows/parity-laps.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - parity/**
      - recordings/**
      - Makefile
      - .github/workflows/parity-laps.yml
  schedule:
    - cron: "23 4 * * 1" # Mondays, 04:23 UTC
  workflow_dispatch:

# Nothing by default; the job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run. Every other run has a group of its
# own, so a push to main never cancels or replaces another's run, and every merge
# that touches the paths is checked.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned by commit SHA (the tag in the comment); Renovate bumps them
# (renovate.json).
jobs:
  parity-laps:
    runs-on: ubuntu-latest
    # The harness's own waits time out well inside this, so a stuck side fails with
    # its own error first.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The module is small and its dependencies few, so nothing is cached.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: parity/go.mod
          cache: false
      - name: The parity harness on the default recordings
        run: make parity

  # `parity events` (paddock#104): every recording in recordings/ through v1's engine
  # and through ecu's replay with the checker listening on the stack's own NATS,
  # events and callouts compared (R6, AC4). Each recording gets a fresh compose
  # project, taken down with its volumes after it, so the job leaves nothing behind.
  parity-events:
    runs-on: ubuntu-latest
    # About 20 s a recording: the stack up and down, and both replays.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: parity/go.mod
          cache: false
      - name: Events and callouts on every recording
        run: make parity-events

  # `parity spoken` (paddock#64 R1, R3): paddock#64's nine recordings through v1's
  # `replay` and through ecu replay with radio on the console in instant timing,
  # both with `script: false`; what each says is diffed, rule and text in order.
  # Each recording gets a fresh compose project, taken down with its volumes.
  parity-spoken:
    runs-on: ubuntu-latest
    # About 40 s a recording: the stack and radio up and down, both replays, and
    # 5 s of quiet from radio.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: parity/go.mod
          cache: false
      - name: What radio says against what v1 says, on paddock#64's recordings
        run: make brundle-demo

  # `parity pitwall` (paddock#133 R6, AC3): #133's three recordings onto one store
  # through v1's replay and v1's pit wall app, and through ecu replay into logbook
  # 0.1.7 with the pit wall v0.1.0 over it (the harness's own compose override), every
  # answer of the data API compared. The stack goes down with its volumes after it.
  parity-pitwall:
    runs-on: ubuntu-latest
    # About 2 min: the stack up and down, three replays a side and the questions.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: parity/go.mod
          cache: false
      - name: v1's pit wall data API against v2's, on #133's three recordings
        run: make parity-pitwall
